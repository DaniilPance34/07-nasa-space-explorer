<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NASA Space Explorer</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#14213d">
  <link rel="icon" href="img/icon-192.png">
  <link rel="apple-touch-icon" href="img/icon-192.png">
</head>
<!-- PWA buttons -->
<div class="pwa-controls">
  <button id="installButton" hidden>
    Install NASA App
  </button>

  <button id="notificationButton">
    Enable Notifications
  </button>
</div>

<!-- Shows when the internet is disconnected -->
<p id="offlineStatus" role="status" hidden>
  You are offline. Previously loaded NASA data may still work.
</p>
<body>
  <div class="container">
    <header class="site-header">
      <img src="img/nasa-worm-logo.png" alt="NASA Logo" class="logo" />
      <h1>Space Explorer</h1>
    </header>

    <div class="filters">
      <input type="date" id="startDate" />
      <input type="date" id="endDate" />
      <button>Get Space Images</button>
    </div>

    <div id="spaceFact" class="space-fact"></div>
    <div id="gallery" class="gallery">
      <div class="placeholder">
        <div class="placeholder-icon">🔭</div>
        <p>Select a date range and click "Get Space Images" to explore the cosmos!</p>
      </div>
    </div>
  </div>

  <!-- Modal popup for NASA photos -->
<div id="imageModal" class="modal" hidden>
  <div class="modal-content">
    <button id="closeModal" class="close-modal" aria-label="Close popup">&times;</button>

    <img id="modalImage" src="" alt="NASA space photo" />

    <h2 id="modalTitle"></h2>

    <p id="modalDate"></p>

    <p id="modalExplanation"></p>
  </div>
</div>
  <script src="js/dateRange.js"></script>
  <script src="js/script.js"></script>
  <script src="js/pwa.js"></script>
  
  
</body>
</html>
